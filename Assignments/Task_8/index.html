<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Card Hover Effect</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <section class="cards-section">


        <!-- Option 1 -->

        <div class="card card-one">

            <span class="arrow-one">
                →
            </span>

            <h2>
                This is option 1
            </h2>

            <p>
                Card description with lots of great facts
                <br>
                and interesting details.
            </p>

        </div>


        <!-- Option 4 -->

        <div class="card card-four">

            <div class="home-icon">
                ⌂
            </div>

            <h2>
                This is option 4
            </h2>

            <p>
                Card description with lots of great facts
                <br>
                and interesting details.
            </p>

            <span class="arrow-four">
                →
            </span>

        </div>


    </section>

</body>

</html>
